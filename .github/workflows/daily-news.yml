name: Daily PNC news pull

on:
  schedule:
    - cron: "0 22 * * *"   # 22:00 UTC = 05:00 in Thailand
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch stories from GDELT
        run: python fetch_gdelt.py

      - name: Save the results in the repo
        run: |
          git config user.name "pnc-news-bot"
          git config user.email "pnc-news-bot@users.noreply.github.com"
          git add news
          git diff --cached --quiet || git commit -m "News pull $(date -u +%F)"
          git push
